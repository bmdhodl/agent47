name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "inbox/**"
      - "memory/**"
      - "ops/**"
      - "proof/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-required:
    name: ci-required
    if: ${{ always() }}
    needs: [test, lint, mcp, mcp-budget, compat, responses-floor]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Require every job group to pass
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python scripts/check_ci_results.py

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: sdk
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install
        run: python -m pip install --require-hashes -r .github/requirements/ci-tools.txt
      - name: Tests with coverage
        run: |
          python -m pytest sdk/tests/ -v \
            --cov=agentguard \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=80
      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: sdk
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: 'pip'
      - name: Install tools
        run: python -m pip install --require-hashes -r .github/requirements/ci-tools.txt
      - name: Check CI tool pins support the SDK Python floor
        run: python scripts/ci_tools_requirements_guard.py
      - name: Check PyPI README sync
        run: python scripts/generate_pypi_readme.py --check
      - name: Check release metadata sync
        run: python scripts/sdk_release_guard.py
      - name: Lint (ruff)
        run: ruff check sdk/agentguard/ scripts/generate_pypi_readme.py scripts/sdk_preflight.py scripts/sdk_release_guard.py scripts/ci_tools_requirements_guard.py scripts/live_cost_reconcile.py scripts/check_ci_results.py sdk/tests/test_ci_results.py
      - name: Security lint (bandit)
        run: bandit -r sdk/agentguard/ -s B101,B110,B112,B311 -q

  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mcp-server/package-lock.json
      - name: Install MCP server deps
        run: npm --prefix mcp-server ci
      - name: MCP build and tests
        run: npm --prefix mcp-server test

  mcp-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: 'pip'
      - name: Install tools
        run: python -m pip install --require-hashes -r .github/requirements/ci-tools.txt
      - name: Install local budget MCP dependencies
        run: python -m pip install --require-hashes -r .github/requirements/mcp-budget.txt
      - name: Local budget MCP lint and tests
        working-directory: agentguard-mcp
        env:
          PYTHONPATH: .
        run: |
          ruff check agentguard_mcp tests
          python -m pytest

  # AG-07: run the full suite with the real framework and provider packages,
  # at the oldest supported versions and at current releases. Dependabot
  # refreshes compat-latest.txt weekly, so an upstream break shows up as a red
  # PR instead of silently disabling a guard.
  compat:
    name: compat (${{ matrix.lock }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: sdk
      AGENTGUARD_REQUIRE_REAL_DEPS: "1"
    strategy:
      fail-fast: false
      matrix:
        lock: [floor, latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: 'pip'
      - name: Install pinned framework and provider packages
        run: python -m pip install --require-hashes -r .github/requirements/compat-${{ matrix.lock }}.txt
      - name: Full suite against real packages
        run: python -m pytest sdk/tests/ -q

  # Keep the Chat Completions 1.40.0 floor; Responses first appears at 1.66.3.
  responses-floor:
    name: responses-floor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: sdk
      AGENTGUARD_REQUIRE_REAL_DEPS: "1"
      OPENAI_AGENTS_DISABLE_TRACING: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: 'pip'
      - name: Install pinned Responses and Agents floor
        run: python -m pip install --require-hashes -r .github/requirements/compat-responses-floor.txt
      - name: Real Responses and Agents floor tests without skips
        run: |
          python -m pytest sdk/tests/test_real_dispatch.py -q -k "responses or agents_sdk" --junitxml=responses-floor.xml
          python -m pytest sdk/tests/test_free_local_clients.py -q --junitxml=free-local-floor.xml
          python - responses-floor.xml free-local-floor.xml <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          for path in sys.argv[1:]:
              suites = list(ET.parse(path).getroot().iter("testsuite"))
              counts = {name: sum(int(suite.get(name, "0")) for suite in suites)
                        for name in ("tests", "skipped", "failures", "errors")}
              if counts["tests"] < 1 or any(counts[name] for name in ("skipped", "failures", "errors")):
                  raise SystemExit(f"Responses floor did not run cleanly: {path}: {counts}")
              print(f'{path}: {counts["tests"]} tests, zero skips/failures/errors')
          PY
