name: Ops Cadence

on:
  schedule:
    - cron: '0 14 * * 1-5'   # Weekdays 9am ET (14:00 UTC)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  staleness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Check ops/ staleness and create issue if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(date +%s)
          roadmap_age=$(( (now - $(git log -1 --format=%ct -- ops/03-ROADMAP_NOW_NEXT_LATER.md)) / 86400 ))
          arch_age=$(( (now - $(git log -1 --format=%ct -- ops/02-ARCHITECTURE.md)) / 86400 ))
          north_age=$(( (now - $(git log -1 --format=%ct -- ops/00-NORTHSTAR.md)) / 86400 ))
          price_date=$(sed -n 's/^LAST_UPDATED = "\(.*\)"/\1/p' sdk/agentguard/cost.py)
          # Validate the exact YYYY-MM-DD shape before passing it to date(1).
          # This rejects an empty/renamed marker and any unexpected content up
          # front (note: date -d "" would otherwise return "now"). A shaped-but-
          # invalid calendar date like 2026-13-45 still fails date -d and is
          # caught by the empty-epoch check below.
          price_epoch=""
          if [[ "$price_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            price_epoch=$(date -d "$price_date" +%s 2>/dev/null || true)
          fi
          if [ -n "$price_epoch" ]; then
            price_age=$(( (now - price_epoch) / 86400 ))
          else
            price_age=-1
            echo "::warning::Could not parse LAST_UPDATED ('${price_date}') as a YYYY-MM-DD date in sdk/agentguard/cost.py; skipping price-age check"
          fi
          DOW=$(date +%u)

          body=""

          if [ "$roadmap_age" -gt 5 ]; then
            body+="### ROADMAP — ${roadmap_age} days since last update\n"
            body+="- [ ] Update Now/Next items in \`ops/03-ROADMAP_NOW_NEXT_LATER.md\`\n"
            body+="- [ ] Add 1–3 current focus notes\n\n"
          fi

          if [ "$price_age" -gt 90 ]; then
            body+="### PRICE TABLE — ${price_age} days since last hand-verify\n"
            body+="- [ ] Re-verify \`sdk/agentguard/cost.py\` + \`sdk/agentguard/price_table.py\` against public list prices\n"
            body+="- [ ] Bump \`LAST_UPDATED\` (and the price_table \`last_updated\`/\`version\` markers)\n\n"
          elif [ "$price_age" -lt 0 ]; then
            body+="### PRICE TABLE — ⚠️ \`LAST_UPDATED\` missing or unparseable in \`sdk/agentguard/cost.py\`\n"
            body+="- [ ] Restore a valid ISO \`LAST_UPDATED\` marker so price staleness can be tracked again\n\n"
          fi

          if [ "$DOW" = "1" ]; then
            if [ "$arch_age" -gt 14 ]; then
              body+="### ARCHITECTURE — ${arch_age} days since last update\n"
              body+="- [ ] Review \`ops/02-ARCHITECTURE.md\` — any boundary changes?\n\n"
            fi
            if [ "$north_age" -gt 30 ]; then
              body+="### NORTHSTAR — ${north_age} days since last update\n"
              body+="- [ ] Review \`ops/00-NORTHSTAR.md\` — still accurate?\n\n"
            fi
          fi

          if [ -n "$body" ]; then
            existing=$(gh issue list --search "[ops-cadence]" --state open --limit 1 --json number -q '.[0].number')
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body "$(printf "Staleness check update:\n\n${body}")"
            else
              gh issue create \
                --title "[ops-cadence] Docs need refresh" \
                --body "$(printf "${body}---\n*Auto-generated by ops-cadence workflow. Close when updated.*")"
            fi
          fi
